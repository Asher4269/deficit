<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Deficit | Login</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="icons/fire-192.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicon (from earlier) -->
    <link rel="icon" type="image/png" href="icons/fire-32.png" />

    <!-- iOS home screen support -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Deficit" />
  </head>

  <body>
    <div class="background-glow"></div>

    <main class="login-container">
      <img src="images/logo.png" alt="Deficit Logo" class="logo" />

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Track your progress.<br />
        Build consistency.
      </p>

      <form id="login-form">
        <div class="input-group">
          <label for="email"> Email </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="input-group">
          <label for="password"> Password </label>

          <input
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input id="remember-me" type="checkbox" />

            <span class="checkmark"></span>

            Remember Me
          </label>

          <a href="#" class="forgot-password"> Forgot Password? </a>
        </div>

        <button class="login-btn" type="submit">Log In</button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <a href="signup.html" class="create-account"> Create an Account </a>
    </main>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Project Scripts -->
    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/login.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch((error) => {
            console.error("Service worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
