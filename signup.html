<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Deficit | Create Account</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="icons/fire-192.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicon (from earlier) -->
    <link rel="icon" type="image/png" href="icons/fire-32.png" />

    <!-- iOS home screen support -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Deficit" />
  </head>

  <body>
    <div class="background-glow"></div>

    <main class="login-container">
      <img src="images/logo.png" alt="Deficit Logo" class="logo" />

      <h1>Create Account</h1>

      <p class="subtitle">Start building consistency today.</p>

      <form id="signup-form">
        <!-- Email -->

        <div class="input-group">
          <label for="email"> Email </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <!-- Password -->

        <div class="input-group">
          <label for="password"> Password </label>

          <input
            id="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <!-- Confirm Password -->

        <div class="input-group">
          <label for="confirm-password"> Confirm Password </label>

          <input
            id="confirm-password"
            type="password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <button class="login-btn" type="submit">Create Account</button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <a href="index.html" class="create-account">
        Already have an account? Log In
      </a>
    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Project Scripts -->
    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/signup.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch((error) => {
            console.error("Service worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
