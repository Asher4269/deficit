<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Deficit | Home</title>

    <link rel="stylesheet" href="css/styles.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="background-glow"></div>

    <main class="page">
      <section class="hero">
        <p class="greeting">Welcome Back,</p>

        <h1 id="user-email">Loading...</h1>
      </section>

      <section class="stat-card">
        <div class="card-header">
          <span>🔥 Streak</span>
        </div>

        <p class="stat-number">0 Days</p>
      </section>

      <section class="stat-card">
        <div class="card-header">
          <span>⚖ Current Weight</span>
        </div>

        <p class="stat-number">---</p>
      </section>

      <section class="stat-card">
        <div class="card-header">
          <span>🍎 Calories</span>
        </div>

        <p class="stat-number">0 / 2200</p>
      </section>

      <section class="stat-card">
        <div class="card-header">
          <span>🏋 Today's Workout</span>
        </div>

        <button class="login-btn">Start Workout</button>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="profile.html" class="active"> 🏠 </a>

      <a href="weight.html"> ⚖️ </a>

      <a href="workouts.html"> 🏋️ </a>

      <a href="calories.html"> 🍎 </a>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>
