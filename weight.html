<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Deficit | Weight</title>

    <link rel="stylesheet" href="css/styles.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="background-glow"></div>

    <main class="page">
      <section class="hero">
        <p class="greeting">Track</p>

        <h1>Weight</h1>
      </section>

      <!-- Chart dashboard -->
      <section class="stat-card">
        <div class="card-header">
          <span>📈 Last 30 Days</span>
        </div>

        <div
          id="chart-empty-state"
          style="
            display: none;
            color: var(--text-secondary);
            padding: 20px 0;
            text-align: center;
          "
        >
          No entries yet. Log your weight to see it here.
        </div>

        <canvas id="weight-chart" height="220"></canvas>
      </section>

      <!-- Log weight trigger -->
      <button class="login-btn" id="log-weight-btn">Log Weight</button>

      <!-- Hidden until "Log Weight" is clicked -->
      <section
        class="stat-card"
        id="log-weight-form-section"
        style="display: none; margin-top: 18px"
      >
        <div class="card-header">
          <span>✏️ Log a Weigh-In</span>
        </div>

        <form id="weight-form">
          <div class="input-group">
            <label for="log-date">Date</label>
            <input id="log-date" type="date" required />
          </div>

          <div class="input-group">
            <label for="log-weight-input">Weight (lbs)</label>
            <input
              id="log-weight-input"
              type="number"
              min="50"
              max="999.9"
              step="0.1"
              placeholder="210"
              required
            />
          </div>

          <div style="display: flex; gap: 10px">
            <button type="submit" class="login-btn">Save</button>
            <button
              type="button"
              class="login-btn"
              id="cancel-log-btn"
              style="background: var(--surface-light); color: var(--text)"
            >
              Cancel
            </button>
          </div>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="profile.html"> 🏠 </a>

      <a href="weight.html" class="active"> ⚖️ </a>

      <a href="workouts.html"> 🏋️ </a>

      <a href="calories.html"> 🍎 </a>

      <a href="settings.html"> ⚙️ </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/weight.js"></script>
  </body>
</html>
