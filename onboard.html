<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Welcome | Deficit</title>

    <link rel="stylesheet" href="css/styles.css" />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script defer src="js/supabase.js"></script>

    <script defer src="js/auth.js"></script>

    <script defer src="js/onboard.js"></script>
  </head>
  <body>
    <div class="onboard-container">
      <div class="onboard-card">
        <h1>Welcome to Deficit</h1>

        <p class="onboard-subtitle">Let's personalize your experience.</p>

        <form id="onboardForm">
          <label for="displayName"> Name </label>

          <input
            id="displayName"
            type="text"
            maxlength="40"
            placeholder="John"
            required
          />

          <label for="weight"> Current Weight (lbs) </label>

          <input
            id="weight"
            type="number"
            min="50"
            max="800"
            step="0.1"
            placeholder="210"
            required
          />

          <button type="submit">Continue</button>
        </form>
      </div>
    </div>
  </body>
</html>
